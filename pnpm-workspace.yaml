packages:
  - apps/*
  - packages/*
allowBuilds:
  '@swc/core': true
  esbuild: true
  protobufjs: true
  # officeparser includes an optional OCR dependency. OCR is deliberately out
  # of scope, so its install script must never download/build extra payloads.
  tesseract.js: false
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.64'
  - ai@7.0.79
